name: Renée targeted Dart format repair

# Normalize only the Renée files touched during the current build repair.
# The follow-up formatter commit does not edit this workflow or retrigger itself.
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/renee-format-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
      - name: Normalize touched Dart files only
        run: |
          dart format \
            lib/utils/lyrics_parser.dart \
            lib/screens/settings/library_settings_page_widgets.dart \
            integration_test/renee_youtube_js_bridge_test.dart \
            test/services/streaming/youtube_explode_audio_resolver_test.dart \
            test/services/streaming/youtube_music_direct_resolver_test.dart \
            test/services/streaming/youtube_music_search_test.dart
      - name: Commit targeted formatting to dev
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- lib test integration_test)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- lib test integration_test
            git commit -m "Format Renée build-repair source and regression tests"
            git push origin HEAD:dev
          fi

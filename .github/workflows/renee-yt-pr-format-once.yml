name: Renée YouTube iOS header-proxy formatting

on:
  push:
    branches:
      - fix/yt-embedded-client-and-live-validation
    paths:
      - '.github/workflows/renee-yt-pr-format-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the YouTube branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up pinned Dart SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
      - name: Format only touched Dart files
        run: |
          dart format \
            lib/services/streaming/network_audio_header_proxy.dart \
            lib/services/streaming/streaming_playback_coordinator.dart \
            lib/services/streaming/youtube_music_direct_resolver.dart \
            lib/services/music_playback_deck.dart \
            test/services/streaming/network_audio_header_proxy_test.dart \
            test/services/streaming/youtube_music_direct_resolver_test.dart
      - name: Commit formatter output and remove this one-shot job
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/renee-yt-pr-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- lib/services/streaming/network_audio_header_proxy.dart lib/services/streaming/streaming_playback_coordinator.dart lib/services/streaming/youtube_music_direct_resolver.dart lib/services/music_playback_deck.dart test/services/streaming/network_audio_header_proxy_test.dart test/services/streaming/youtube_music_direct_resolver_test.dart
          git commit -m "style(youtube): format iOS header relay and remove one-shot formatter"
          git push origin HEAD:fix/yt-embedded-client-and-live-validation

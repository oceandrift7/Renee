name: Renée YouTube authentication branch formatting and tests

on:
  push:
    branches:
      - fix/yt-embedded-client-and-live-validation
    paths:
      - '.github/workflows/renee-yt-pr-format-once.yml'
      - 'lib/services/streaming/youtube_music_signed_session.dart'

permissions:
  contents: write

jobs:
  auth-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
      - name: Format touched YouTube Dart files
        run: |
          dart format \
            lib/services/streaming/youtube_music_signed_session.dart \
            lib/services/streaming/youtube_music_direct_resolver.dart \
            lib/services/streaming/renee_online_playback.dart \
            test/services/streaming/youtube_music_signed_session_test.dart
      - name: Preflight package and scoped Dart analyzer
        run: |
          flutter pub get
          flutter analyze \
            lib/services/streaming/youtube_music_signed_session.dart \
            lib/services/streaming/youtube_music_direct_resolver.dart \
            lib/services/streaming/renee_online_playback.dart \
            test/services/streaming/youtube_music_signed_session_test.dart
      - name: Run signed-in HTTP and baseline YouTube resolver tests
        run: |
          flutter test \
            test/services/streaming/youtube_music_signed_session_test.dart \
            test/services/streaming/youtube_music_direct_resolver_test.dart \
            test/services/streaming/network_audio_header_proxy_test.dart
      - name: Commit formatting and remove one-shot workflow
        run: |
          set -euo pipefail
          git rm -- .github/workflows/renee-yt-pr-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            lib/services/streaming/youtube_music_signed_session.dart \
            lib/services/streaming/youtube_music_direct_resolver.dart \
            lib/services/streaming/renee_online_playback.dart \
            test/services/streaming/youtube_music_signed_session_test.dart
          git commit -m "style(youtube): validate signed-in client and clean up one-shot tests"
          git push origin HEAD:fix/yt-embedded-client-and-live-validation
